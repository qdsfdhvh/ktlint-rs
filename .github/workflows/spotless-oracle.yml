name: Spotless oracle regeneration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/oracle/spotless-8.8.0-ktlint-1.8.0/**"
      - "scripts/spotless-differential.sh"
      - "scripts/spotless_diff.py"
      - "src/config/**"
      - "src/formatter/**"
      - "src/rules/spacing/operator.rs"

jobs:
  differential:
    name: Spotless 8.8.0 / ktlint 1.8.0 differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./scripts/spotless-differential.sh
      - name: Verify known mismatch detection
        run: ./scripts/spotless-differential.sh --expect-mismatch
      - name: Upload minimized mismatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotless-differential-artifacts
          path: target/spotless-diff-artifacts
          if-no-files-found: ignore
