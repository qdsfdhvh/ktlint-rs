name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload release assets for'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Ensure release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # Matrix jobs race to create a fresh tag release; concurrent
          # `gh release create` calls 422, so tolerate the loser and let
          # the upload step (--clobber) settle the final asset set.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" \
            || true
      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC="target/${{ matrix.target }}/release/ktlint-rs${{ matrix.suffix == 'windows-x86_64.exe' && '.exe' || '' }}"
          # Rename to a platform-suffixed asset name so linux/macOS
          # binaries don't clobber each other (bare `ktlint-rs`).
          cp "$SRC" "$RUNNER_TEMP/ktlint-rs-${{ matrix.suffix }}"
          gh release upload "${{ inputs.tag || github.ref_name }}" "$RUNNER_TEMP/ktlint-rs-${{ matrix.suffix }}" --clobber
