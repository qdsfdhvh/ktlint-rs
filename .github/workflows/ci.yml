name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --bins

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --bins


  spotless-differential:
    name: Spotless differential (offline)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./scripts/spotless-differential.sh --offline
      - run: python3 scripts/generate_rule_plan.py --binary target/release/ktlint-rs --check
      - name: Verify every mismatch surface fails closed
        run: |
          for kind in discovery config diagnostics format idempotence; do
            ./scripts/spotless-differential.sh --offline --inject-mismatch "$kind"
          done
      - name: Oracle differential on the regression case corpus
        run: |
          ./scripts/get-ktlint.sh 1.8.0 >/dev/null
          printf '#!/bin/bash\nexec java -jar %s "$@"\n' "$PWD/.ktlint/ktlint-1.8.0.jar" > .ktlint/ktlint
          chmod +x .ktlint/ktlint
          KTLINT_JVM="$PWD/.ktlint/ktlint" ./scripts/oracle-diff.sh
          KTLINT_JVM="$PWD/.ktlint/ktlint" ./scripts/format-diff.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --bins

  mutation-gates:
    name: Mutation gates (#87)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./scripts/mutation-test.sh target/release/ktlint-rs tests/fixtures/ktor 40

  perf-gates:
    name: Perf gates (#88)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./scripts/perf-gates.sh target/release/ktlint-rs
